[project]
name = "vocabbot"
version = "1.0.0rc2"
description = "Vocabulary in one to three languages at once with spaced repetition, in the terminal and in Claude or Codex."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["vocabulary", "spaced-repetition", "fsrs", "language-learning", "claude", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Polish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = ["rich>=15.0.0"]

[project.scripts]
vocabbot = "vocabbot.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
    "fsrs>=6.3.3",
]
data = [
    "anthropic>=2.8.0",
    "wordfreq>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "RUF", "PT", "TID"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# the course pipeline imports its own modules by name; without this, a local
# build/ folder would make ruff sort `build` differently than CI does
known-first-party = ["vocabbot"]
known-local-folder = ["build", "concepts", "pipeline", "review", "sources", "starter", "tatoeba", "wiktionary"]

[tool.ruff.lint.per-file-ignores]
# the review prompt is prose; its lines stay whole
"tools/courses/review.py" = ["E501"]
# assertions on several fields of one result read better together
"tests/*" = ["PT018"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
