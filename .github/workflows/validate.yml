name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest
      - name: vocabbot.pyz without site-packages
        run: |
          uv run python scripts/build.py pyz
          python3 -I -S build/vocabbot.pyz --version
          python3 -I -S build/vocabbot.pyz course check --json

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
      - run: uv sync --locked
      - name: The engine and the rules in every skill are current
        run: uv run python scripts/build.py skills --check
      - name: Repository checks
        run: uv run python scripts/validate.py
      - name: Session files and their learners, without a model
        run: uv run python scripts/session_test.py --check
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Plugin and marketplace manifests (plugin directory profile)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.325
          claude plugin validate . --strict
          claude plugin validate ./plugin --profile directory --strict
