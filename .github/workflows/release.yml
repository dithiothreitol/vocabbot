name: release

# A tag vX.Y.Z (or vX.Y.Z-rc.N) builds the packages from that commit and
# publishes them as a GitHub release: the wheel and the sdist, vocabbot.pyz,
# vocabbot.plugin (the whole plugin, for Cowork's Upload plugin), one zip per
# skill (for claude.ai, which takes single skills) and SHA256SUMS.
#
# The build job runs every check with a read-only token that is not kept in
# the checkout. The release job only uploads what the build produced. PyPI
# gets the package only when the repository variable PUBLISH_PYPI is "true"
# (trusted publishing, environment "pypi").

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.15"
      - run: uv sync --locked

      - name: The tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          test "v$version" = "$TAG" || { echo "tag $TAG, plugin.json $version"; exit 1; }

      - name: Tests and checks
        run: |
          uv run ruff format --check
          uv run ruff check
          uv run mypy
          uv run pytest
          uv run python scripts/session_test.py --check

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Plugin and marketplace manifests
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.325
          claude plugin validate . --strict
          claude plugin validate ./plugin --profile directory --strict

      - name: Packages (runs build.py skills --check and validate.py first)
        run: uv run python scripts/build.py package

      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "${TAG#v}" > notes.md <<'EOF'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(sys.argv[1]) + r"\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "See CHANGELOG.md.")
          EOF
          mv notes.md dist/notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$REPO" $prerelease \
            --title "VocabBot $version" --notes-file dist/notes.md \
            dist/*.whl dist/*.tar.gz dist/vocabbot.pyz dist/vocabbot.plugin \
            dist/skills/*.zip dist/SHA256SUMS

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Only the wheel and the sdist go to PyPI
        run: |
          mkdir pypi
          mv dist/*.whl dist/*.tar.gz pypi/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: pypi/
